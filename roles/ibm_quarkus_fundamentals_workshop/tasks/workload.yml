---

- name: Configure Nodes for ODF
  ansible.builtin.include_tasks: odf_setup.yaml

- name: Create CatalogSource Index 4.18
  k8s:
    state: present
    merge_type:
    - strategic-merge
    - merge
    definition: "{{ lookup('file', item ) | from_yaml }}"
  loop:
  - redhat-operators-index.yaml
  - community-operators-index.yaml

- name: Configure workshop support access
  ansible.builtin.include_tasks: workshop-admins.yml

- name: Install Showroom
  ansible.builtin.include_tasks: showroom.yml

- name: Install OpenShift Gitops
  ansible.builtin.include_tasks: openshift_gitops.yml

- name: Install Namespace Configuration Operator
  ansible.builtin.include_tasks: namespaces_operator.yml

- name: Create operator subscription for kubernetes-imagepuller-operator
  kubernetes.core.k8s:
    merge_type:
    - merge
    definition: "{{ lookup('file', 'kubernetes-imagepuller-operator_subscription.yaml' ) }}"

- name: Install ArgoCD Apps
  ansible.builtin.include_tasks: argo-apps.yml

- name: Install Advanced workshop deps
  include_tasks: install-advanced.yml
  when:
    - advanced_workshop_enabled | default(false) | bool

- name: Install Dev Spaces operator and CheCluster
  ansible.builtin.include_tasks: devspaces_operator.yml

- name: Final workshop setup
  ansible.builtin.include_tasks: finally.yml

