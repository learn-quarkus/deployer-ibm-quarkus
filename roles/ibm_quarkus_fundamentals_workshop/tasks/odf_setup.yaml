---
- name: Find worker nodes
  k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
      - "node-role.kubernetes.io/worker"
  register: r_worker_nodes

- name: Enable ODF on worker nodes
  k8s:
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item.metadata.name }}"
        labels: "{{ item.metadata.labels | combine({'cluster.ocs.openshift.io/openshift-storage': ''}) }}"
    state: present
  loop: "{{ r_worker_nodes.resources }}"

- name: Set default StorageClass
  k8s:
    state: present
    definition:
      kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
        name: ocs-external-storagecluster-ceph-rbd
        annotations:
          storageclass.kubernetes.io/is-default-class: 'true'
