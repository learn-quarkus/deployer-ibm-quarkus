kind: NamespaceConfig
apiVersion: redhatcop.redhat.io/v1alpha1
metadata:
  name: ns-project-config
spec:
  labelSelector:
    matchLabels:
      ibm_user_project: "True"
  templates:
    - objectTemplate: |
        apiVersion: v1
        kind: LimitRange
        metadata:
          name: '{{ .Name }}-core-resource-limits'
          namespace: {{ .Name }}
        spec:
          limits:
            - type: Container
              max:
                cpu: 4
                memory: 12Gi
              default:
                cpu: 500m
                memory: 1.5Gi
              defaultRequest:
                cpu: 50m
                memory: 256Mi
            - type: Pod
              max:
                cpu: 4
                memory: 12Gi
    - objectTemplate: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: monitoring-edit
          namespace: "{{ .Name }}"
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name:  monitoring-edit
        subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: {{ (lookup "v1" "Namespace" "" .Name ).metadata.annotations.user_email }}
    - objectTemplate: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: admin
          namespace: "{{ .Name }}"
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: admin
        subjects:
          - apiGroup: rbac.authorization.k8s.io
            kind: User
            name: {{ (lookup "v1" "Namespace" "" .Name ).metadata.annotations.user_email }}
    - objectTemplate: |
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: rhbk-sub-{{ .Name }}
          namespace: "{{ .Name }}"
        spec:
          channel: stable-v24
          installPlanApproval: Automatic
          name: rhbk-operator
          source: redhat-operators-index
          sourceNamespace: openshift-marketplace
    - objectTemplate: |
        apiVersion: operators.coreos.com/v1alpha2
        kind: OperatorGroup
        metadata:
          generateName: rhbk-
          annotations:
            olm.providedAPIs: >-
              Keycloak.v2alpha1.k8s.keycloak.org,KeycloakRealmImport.v2alpha1.k8s.keycloak.org
          name: rhbk-operator-group
          namespace: "{{ .Name }}"
        spec:
          targetNamespaces:
            - "{{ .Name }}"
